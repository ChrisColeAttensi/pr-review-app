[package]
name = "pr-bar"
version = "0.1.0"
description = "Menu bar PR monitor"
authors = ["Chris Cole"]
edition = "2021"

[lib]
name = "pr_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pr_core = { path = "../../core" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.5.0"
tauri-plugin-autostart = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

